name: ag1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # -eo pipefail, so tee cannot hide a failed run
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest -q
      # The anchors stay in this job's log and outside results/, so the uploaded
      # bundle is verified against keys it cannot supply itself.
      - run: python -m ag1 --out results | tee "$RUNNER_TEMP/run.log"
      - run: |
          python -m ag1 --verify results $(sed -n 's/^anchors: //p' "$RUNNER_TEMP/run.log")
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ag1-results-py${{ matrix.python-version }}
          path: results/

  forgejo:
    # The same steps against a real Forgejo behind the enforcement point.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Start Forgejo
        run: |
          scripts/forgejo-up.sh > "$RUNNER_TEMP/forgejo.env"
          echo "::add-mask::$(sed -n 's/^export AG1_FORGEJO_TOKEN=//p' "$RUNNER_TEMP/forgejo.env")"
          sed 's/^export //' "$RUNNER_TEMP/forgejo.env" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/forgejo.env"
      - run: pytest -q tests/test_forgejo.py
      - run: python -m ag1 --service forgejo --out results | tee "$RUNNER_TEMP/run.log"
      - run: |
          python -m ag1 --verify results $(sed -n 's/^anchors: //p' "$RUNNER_TEMP/run.log")
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ag1-results-forgejo
          path: results/

  compose:
    # Every party and enforcement point as a separate container. The anchors come from
    # the issuer and the enforcement points' own logs, not from the driver's output.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: scripts/compose-up.sh
      - run: docker compose run --rm driver | tee "$RUNNER_TEMP/run.log"
      - name: Verify every bundle against independently logged anchors
        run: |
          root=$(docker compose exec -T issuer python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://localhost:8000/identities'))['identities'][0]['public_id'])")
          keys=()
          for service in pep-main pep-receiving pep-other pep-baseline; do
            keys+=($(docker compose logs --no-log-prefix "$service" \
              | sed -n 's/^enforcement point \([a-z-]*\): evidence key \([0-9a-f]*\)$/--evidence-key \1=\2/p'))
          done
          python -m ag1 --verify results-compose --trusted-root "$root" "${keys[@]}"
          # The driver's printed anchors must agree with them.
          grep -qF -- "--trusted-root $root" "$RUNNER_TEMP/run.log"
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ag1-results-compose
          path: results-compose/
      - if: always()
        run: docker compose down -v
