[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nccoe-ag1-harness"
version = "0.1.0"
description = "Reproducible harness for the AG-1 agent authorization scenario proposed for NIST NCCoE DevSecOps Example Implementation 3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tenuo==0.3.3",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ag1 = "ag1.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
