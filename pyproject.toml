[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nccoe-ag1-harness"
version = "0.3.0"
description = "Reproducible harness for the AG-1 agent authorization scenario proposed for NIST NCCoE DevSecOps Example Implementation 3"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "cryptography==50.0.2",
]

[project.optional-dependencies]
tenuo = ["tenuo==0.3.5", "cbor2==6.1.5"]
test = ["pytest==9.1.1"]

[project.scripts]
ag1 = "ag1.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
